<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Bầu trời & Đồi cỏ -->
  <rect width="300" height="120" fill="url(#skyGrad)"/>
  <circle cx="250" cy="40" r="25" fill="#fef08a" opacity="0.9"/>
  <ellipse cx="150" cy="180" rx="200" ry="80" fill="url(#grassGrad)"/>
  
  <!-- Chú Ngựa Nâu (Horse) -->
  <g transform="translate(60, 45)">
    <!-- Thân ngựa -->
    <ellipse cx="90" cy="70" rx="45" ry="25" fill="#854d0e"/>
    <!-- Cổ & Đầu -->
    <path d="M55,65 Q45,35 30,30 Q35,20 48,22 Q60,25 75,50 Z" fill="#854d0e"/>
    <!-- Tai & Mõm -->
    <polygon points="35,18 40,26 32,25" fill="#713f12"/>
    <ellipse cx="25" cy="32" rx="7" ry="5" fill="#713f12"/>
    <!-- Bờm ngựa -->
    <path d="M48,23 Q55,35 70,55" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- 4 Chân -->
    <rect x="58" y="88" width="7" height="35" rx="3" fill="#713f12"/>
    <rect x="72" y="88" width="7" height="32" rx="3" fill="#854d0e"/>
    <rect x="110" y="88" width="7" height="35" rx="3" fill="#713f12"/>
    <rect x="122" y="88" width="7" height="32" rx="3" fill="#854d0e"/>
    <!-- Đuôi ngựa -->
    <path d="M135,65 Q150,75 145,100" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
