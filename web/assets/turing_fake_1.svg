<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#1e293b"/>
  <!-- Khuôn mặt do GAN tạo lỗi: 1 bên có bông tai tròn, 1 bên bị nhòe thành vệt kỳ dị, con ngươi 2 mắt khác kích cỡ -->
  <ellipse cx="100" cy="110" rx="42" ry="52" fill="#fed7aa"/>
  <path d="M55,110 Q50,55 100,55 Q150,55 145,110 Z" fill="#334155"/>
  <!-- Mắt trái to, mắt phải méo -->
  <circle cx="85" cy="105" r="6" fill="#0f172a"/>
  <circle cx="84" cy="103" r="2" fill="#ffffff"/>
  <ellipse cx="115" cy="105" rx="4" ry="5.5" fill="#0f172a"/>
  <!-- Bông tai trái hình tròn, bên phải bị biến dạng thành vệt méo -->
  <circle cx="56" cy="120" r="4.5" fill="#facc15"/>
  <path d="M142,118 Q148,125 145,130" stroke="#facc15" stroke-width="3" fill="none"/>
  <path d="M90,135 Q100,145 110,135" stroke="#e11d48" stroke-width="2.5" fill="none"/>
</svg>
