<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#1e1b4b"/>
  <!-- Nét cọ xoáy Van Gogh (Starry Night Swirls) -->
  <path d="M20,60 Q80,20 140,60 T260,50" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M40,80 Q100,40 160,80 T280,70" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M10,40 Q70,5 130,40 T250,30" stroke="#818cf8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Mặt trăng xoáy vàng rực rỡ -->
  <circle cx="230" cy="45" r="28" fill="#fef08a" opacity="0.4"/>
  <circle cx="230" cy="45" r="20" fill="#facc15"/>
  <circle cx="230" cy="45" r="12" fill="#ca8a04"/>

  <!-- Cây bách lửa đặc trưng phong cách Van Gogh -->
  <path d="M15,200 Q20,120 35,40 Q50,110 55,200 Z" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  
  <!-- Nhà cửa nét cọ biểu cảm -->
  <rect x="90" y="130" width="60" height="40" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="80,130 120,95 160,130" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
  <rect x="110" y="145" width="15" height="15" fill="#fde047"/>
  
  <rect x="180" y="120" width="70" height="50" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="170,120 215,85 260,120" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
  <rect x="205" y="135" width="20" height="20" fill="#fde047"/>
  
  <!-- Đồi lượn sóng sơn dầu -->
  <path d="M0,170 Q75,150 150,175 T300,170 L300,200 L0,200 Z" fill="#065f46" stroke="#34d399" stroke-width="3"/>
</svg>
