<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradZ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grassGradZ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Bầu trời & Đồi cỏ được giữ nguyên vẹn bởi CycleGAN -->
  <rect width="300" height="120" fill="url(#skyGradZ)"/>
  <circle cx="250" cy="40" r="25" fill="#fef08a" opacity="0.9"/>
  <ellipse cx="150" cy="180" rx="200" ry="80" fill="url(#grassGradZ)"/>
  
  <!-- Chú Ngựa Vằn (Zebra do Generator tạo ra) -->
  <g transform="translate(60, 45)">
    <!-- Thân ngựa vằn nền trắng -->
    <ellipse cx="90" cy="70" rx="45" ry="25" fill="#f8fafc"/>
    <!-- Sọc vằn đen trên thân -->
    <path d="M65,58 L62,82 M75,50 L72,88 M85,47 L83,92 M95,48 L97,92 M107,52 L111,88 M118,58 L124,82" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Cổ & Đầu -->
    <path d="M55,65 Q45,35 30,30 Q35,20 48,22 Q60,25 75,50 Z" fill="#f8fafc"/>
    <path d="M42,26 L38,36 M49,30 L45,45 M58,38 L54,54" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tai & Mõm đen -->
    <polygon points="35,18 40,26 32,25" fill="#0f172a"/>
    <ellipse cx="25" cy="32" rx="7" ry="5" fill="#0f172a"/>
    <!-- Bờm sọc đen trắng -->
    <path d="M48,23 Q55,35 70,55" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- 4 Chân có sọc vằn -->
    <rect x="58" y="88" width="7" height="35" rx="3" fill="#f8fafc"/>
    <path d="M58,95 L65,95 M58,105 L65,105 M58,115 L65,115" stroke="#0f172a" stroke-width="2"/>
    <rect x="72" y="88" width="7" height="32" rx="3" fill="#f8fafc"/>
    <path d="M72,95 L79,95 M72,105 L79,105" stroke="#0f172a" stroke-width="2"/>
    <rect x="110" y="88" width="7" height="35" rx="3" fill="#f8fafc"/>
    <path d="M110,95 L117,95 M110,105 L117,105 M110,115 L117,115" stroke="#0f172a" stroke-width="2"/>
    <rect x="122" y="88" width="7" height="32" rx="3" fill="#f8fafc"/>
    <path d="M122,95 L129,95 M122,105 L129,105" stroke="#0f172a" stroke-width="2"/>
    <!-- Đuôi ngựa vằn -->
    <path d="M135,65 Q150,75 145,100" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
