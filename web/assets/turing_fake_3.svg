<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#0f172a"/>
  <!-- Bàn tay lỗi của GAN: 6 ngón tay và các khớp bị dính vào nhau -->
